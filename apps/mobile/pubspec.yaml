name: walkin_mobile
description: WalkIn customer app for iOS and Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_functions: ^5.3.0
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.0
  firebase_app_check: ^0.3.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
